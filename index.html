<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un invito a cena</title>
  <!-- Anteprima del link e indicizzazione: tutto generico, nessun contenuto personale e nessun indirizzo. -->
  <meta name="description" content="Lista invitati. Solo per gli amici.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff4e0">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Un invito a cena">
  <meta property="og:description" content="Lista invitati. Solo per gli amici.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Un invito a cena">
  <meta name="twitter:description" content="Lista invitati. Solo per gli amici.">
  <!-- Icona a palloncino incorporata (data:), così non parte nessuna richiesta di rete. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 78 L44 88 L56 88 Z' fill='%23d9381e'/%3E%3Cpath d='M50 88 Q40 94 50 100' fill='none' stroke='%23555' stroke-width='3'/%3E%3Cellipse cx='50' cy='42' rx='30' ry='36' fill='%23ff5a45'/%3E%3Cellipse cx='38' cy='28' rx='7' ry='11' fill='%23fff' opacity='.45' transform='rotate(20 38 28)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!--
    Cornice di festa: markup statico, fuori da <main id="invito"> (che src/main.js ridisegna),
    quindi il tick di ogni secondo e i cambi di vista non la toccano mai. Solo SVG/CSS inline,
    nessuna richiesta di rete. Gli stili stanno in src/style.css, sezione "Cornice di festa".
  -->
  <div class="festa" aria-hidden="true">
    <svg class="simboli" width="0" height="0" focusable="false">
      <defs>
        <symbol id="palloncino" viewBox="0 0 60 150">
          <path d="M30 90 q-7 14 0 28 t0 28" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke: var(--tenue)" opacity=".55"/>
          <path d="M30 4 C48 4 58 22 58 42 C58 62 42 78 30 82 C18 78 2 62 2 42 C2 22 12 4 30 4 Z" fill="currentColor"/>
          <path d="M30 82 L24.5 91 L35.5 91 Z" fill="currentColor"/>
          <ellipse cx="19" cy="25" rx="5" ry="10" transform="rotate(25 19 25)" style="fill: var(--carta)" opacity=".5"/>
        </symbol>
      </defs>
    </svg>

    <svg class="festone" width="100%" height="56" focusable="false">
      <defs>
        <pattern id="bandierine" width="160" height="56" patternUnits="userSpaceOnUse">
          <path d="M0 4 Q80 28 160 4" fill="none" stroke-width="2" style="stroke: var(--tenue)" opacity=".7"/>
          <path d="M5 9 L35 9 L20 43 Z" style="fill: var(--corallo)"/>
          <path d="M45 15 L75 15 L60 49 Z" style="fill: var(--giallo)"/>
          <path d="M85 15 L115 15 L100 49 Z" style="fill: var(--turchese)"/>
          <path d="M125 9 L155 9 L140 43 Z" style="fill: var(--rosa)"/>
        </pattern>
      </defs>
      <rect width="100%" height="56" fill="url(#bandierine)"/>
    </svg>

    <div class="coriandoli"></div>
    <!-- Strato dello scoppio di coriandoli all'Ingresso riuscito: vuoto, src/main.js ci mette e toglie i pezzi. -->
    <div class="scoppio"></div>

    <svg class="palloncino sx1" viewBox="0 0 60 150" focusable="false" style="color: var(--corallo)"><use href="#palloncino"/></svg>
    <svg class="palloncino sx2" viewBox="0 0 60 150" focusable="false" style="color: var(--turchese)"><use href="#palloncino"/></svg>
    <svg class="palloncino sx3" viewBox="0 0 60 150" focusable="false" style="color: var(--giallo)"><use href="#palloncino"/></svg>
    <svg class="palloncino dx1" viewBox="0 0 60 150" focusable="false" style="color: var(--rosa)"><use href="#palloncino"/></svg>
    <svg class="palloncino dx2" viewBox="0 0 60 150" focusable="false" style="color: var(--viola)"><use href="#palloncino"/></svg>
    <svg class="palloncino dx3" viewBox="0 0 60 150" focusable="false" style="color: var(--corallo)"><use href="#palloncino"/></svg>
  </div>

  <main class="invito" id="invito">
    <noscript><p>Per vedere l'Invito serve JavaScript attivo.</p></noscript>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
